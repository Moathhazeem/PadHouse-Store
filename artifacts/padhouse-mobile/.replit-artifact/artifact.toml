kind = "mobile"
previewPath = "/padhouse-mobile/"
title = "PadHouse Mobile"
description = "A native Arabic RTL shopping app for PadHouse Store customers. Browse iPad accessories, search verified compatibility, save favorites, manage a persistent cart, and complete a local demo checkout."
version = "1.0.0"
id = "artifacts/padhouse-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/padhouse-mobile/" ]
localPort = 24169

[services.development]
run = "pnpm --filter @workspace/padhouse-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/padhouse-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/padhouse-mobile", "run", "serve" ]

[services.env]
PORT = "24169"
BASE_PATH = "/padhouse-mobile/"
